name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r web_app/requirements.txt

    - name: Run Tests
      run: |
        cd web_app
        # Set DJANGO_SETTINGS_MODULE explicitly for pytest
        export DJANGO_SETTINGS_MODULE=pa_bridges_project.settings
        pytest

    - name: Build Docker image
      run: |
        # Build from root context
        docker build . --file web_app/Dockerfile --tag pa-bridges-app:latest
