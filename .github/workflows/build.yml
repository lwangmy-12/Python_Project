name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r web_app/requirements.txt

    - name: Run Tests
      run: |
        cd web_app
        # Set DJANGO_SETTINGS_MODULE explicitly for pytest
        export DJANGO_SETTINGS_MODULE=pa_bridges_project.settings
        pytest

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      run: |
        # Convert repository owner to lowercase for Docker tag
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        IMAGE_ID=ghcr.io/$OWNER/pa-bridges-app
        
        # Build from root context
        docker build . --file web_app/Dockerfile --tag $IMAGE_ID:latest
        
        # Push to GitHub Packages
        docker push $IMAGE_ID:latest
